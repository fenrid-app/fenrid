name: Publish Fenrid Windows installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fenrid-windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare the next release version
        run: npm run prepare:release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows installer and update feed
        run: npm run dist
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish the installer and update feed
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$version"
          $assets = @(
            (Join-Path 'dist' "Fenrid-Installer-$version-x64.exe"),
            (Join-Path 'dist' "Fenrid-Installer-$version-x64.exe.blockmap"),
            (Join-Path 'dist' 'latest.yml')
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected release asset was not built: $asset"
            }
          }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "Fenrid Installer $tag" --notes "Windows installer and update feed for Fenrid Installer." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
